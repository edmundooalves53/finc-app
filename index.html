<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E1210">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Finc</title>

<!-- Firebase (compat build — funciona com script simples, sem precisar de bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #0E1210;
    --card: #161C19;
    --card-2: #1B2320;
    --card-border: #232B27;
    --ink: #EDEFEC;
    --muted: #8B958F;
    --green: #3ECF8E;
    --green-deep: #1F5A42;
    --track: #232B27;
    --danger: #C0524A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ height:100%; }
  body{
    margin:0;
    background: #05070E;
    color:var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }

  #shell{
    width: 380px;
    max-width: 100%;
    height: 720px;
    max-height: 92vh;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    overflow: hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    position: relative;
  }

  #content{
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px 12px;
  }
  #content::-webkit-scrollbar{ width:0; }

  .wordmark{ display:flex; align-items:center; gap:8px; margin-bottom: 18px; }
  .wordmark svg{ width:20px; height:20px; }
  .wordmark .word{ font-size:15px; font-weight:800; letter-spacing:0.02em; }
  .wordmark .word .c{ color: var(--green); }

  .backbar{
    display:flex; align-items:center; gap:8px;
    font-size: 14px; font-weight:700; margin-bottom: 16px; cursor:pointer;
  }
  .backbar .arrow{ font-size:16px; color: var(--muted); }

  .app-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px; }
  .app-topbar .left{ display:flex; align-items:flex-end; gap:7px; }
  .hamburger{ display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; margin-bottom:6px; }
  .hamburger span{ width:19px; height:2.5px; background: var(--green); border-radius:2px; }
  .topbar-logo{ width:22px; height:46px; flex-shrink:0; }
  .topbar-word{ font-size:28px; font-weight:800; letter-spacing:0.01em; }
  .topbar-word .c{ color: var(--green); }
  .bell-btn{ position:relative; color: var(--ink); width:22px; height:22px; cursor:pointer; }
  .bell-btn svg{ width:100%; height:100%; }
  .bell-btn .dot{ position:absolute; top:-1px; right:-1px; width:7px; height:7px; border-radius:50%; background: var(--green); border: 1.5px solid var(--bg); }

  /* Side menu */
  #menu-overlay{ position:absolute; inset:0; background: rgba(0,0,0,0.55); z-index: 40; }
  .side-menu{
    position:absolute; top:0; left:0; bottom:0; width: 78%; max-width: 290px;
    background: var(--card); border-right: 1px solid var(--card-border);
    padding: 26px 18px; display:flex; flex-direction:column; gap:4px;
  }
  .side-menu .menu-brand{ display:flex; align-items:center; gap:5px; margin-bottom: 22px; }
  .side-menu .menu-brand svg{ width:13px; height:27px; flex-shrink:0; }
  .menu-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 10px; border-radius: 12px; font-size: 13.5px; font-weight:600;
    color: var(--ink); cursor:pointer;
  }
  .menu-item svg{ width:19px; height:19px; color: var(--muted); flex-shrink:0; }
  .menu-item.active{ background: rgba(62,207,142,0.1); color: var(--green); }
  .menu-item.active svg{ color: var(--green); }
  .menu-item:active{ background: var(--card-2); }

  /* Próximo compromisso — layout exato da referência */
  .pc-card{
    display:flex; align-items:center; gap:12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 14px; margin-bottom: 4px; cursor:pointer;
  }
  .pc-icon{
    width:42px; height:42px; border-radius:12px; background: rgba(62,207,142,0.12);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .pc-icon svg{ width:20px; height:20px; color: var(--green); }
  .pc-mid{ flex:1; }
  .pc-label{ font-size:11px; color: var(--muted); margin-bottom:2px; }
  .pc-date{ font-size:15px; font-weight:800; color: var(--ink); }
  .pc-weekday{ font-size:11px; color: var(--muted); margin-top:1px; }
  .pc-divider{ width:1px; align-self:stretch; background: var(--card-border); }
  .pc-right{ text-align:right; padding: 0 4px; }
  .pc-right .pc-label{ margin-bottom:4px; }
  .pc-valor{ font-size:15px; font-weight:800; color: var(--green); }

  .greeting{ font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .greeting-line{ font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .greeting-line .name-green{ color: var(--green); }
  .subtitle{ font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }

  .status-row{ display:flex; align-items:flex-start; gap: 14px; }
  .ring-mini{ position:relative; width:98px; height:98px; flex-shrink:0; }
  .ring-mini svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .ring-mini .pct{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:15px; font-weight:800;
  }
  .ring-mini .pct span{ font-size:8.5px; font-weight:600; color: var(--muted); }
  .status-text{ flex:1; }
  .status-check{ display:flex; align-items:center; gap:7px; color: var(--green); font-size:12px; font-weight:700; margin-bottom:7px; line-height:1.3; }
  .check-bubble{
    width:19px; height:19px; border-radius:50%; background: var(--green);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .check-bubble svg{ width:11px; height:11px; }
  .status-desc{ font-size: 12.5px; color: var(--ink); line-height:1.4; font-weight:700; }

  .hero-divider{ border-top:1px solid var(--card-border); margin: 14px 0 12px; }
  .hero-bottom-row{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .chev-btn{
    width:28px; height:28px; border-radius:50%; background: rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; color: var(--muted); font-size:15px;
  }

  .compromisso-label{ font-size:10.5px; color: var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px; }
  .compromisso-card{
    display:flex; align-items:center; gap:12px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 16px; padding: 14px; margin-bottom: 4px; cursor:pointer;
  }
  .compromisso-icon{
    width:40px; height:40px; border-radius:12px; background: rgba(62,207,142,0.12);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;
  }
  .compromisso-info{ flex:1; }
  .compromisso-days{ color: var(--green); font-weight:800; font-size:13px; }
  .compromisso-date{
    display:inline-block; margin-top:3px; color: var(--muted); font-size:10px; font-weight:700;
    background: var(--track); border-radius:100px; padding:2px 8px;
  }
  .compromisso-valor-label{ color: var(--muted); font-size:10.5px; }
  .compromisso-valor{ font-weight:800; font-size:13px; }

  .motiv-card{
    background: radial-gradient(ellipse at 20% 30%, rgba(62,207,142,0.18), transparent 60%), var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px; padding: 16px; margin: 12px 0;
    display:flex; align-items:center; gap: 14px;
  }
  .motiv-flag{ font-size: 30px; flex-shrink:0; }
  .motiv-text{ font-size: 12.5px; line-height:1.5; color: var(--ink); }
  .motiv-text b{ color: var(--green); }
  .motiv-sub{ font-size:11.5px; color: var(--muted); margin-top:4px; }

  .quick-label{ font-size:13px; font-weight:800; margin: 18px 0 10px; }
  .quick-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
  .quick-card{
    background: var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding: 12px 10px; cursor:pointer;
  }
  .quick-card.disabled{ opacity:0.45; cursor:default; }
  .quick-icon{
    width:30px; height:30px; border-radius:9px; background: rgba(62,207,142,0.12);
    display:flex; align-items:center; justify-content:center; margin-bottom:8px; color: var(--green);
  }
  .quick-icon svg{ width:15px; height:15px; }
  .quick-title{ font-size:11.5px; font-weight:700; margin-bottom:2px; }
  .quick-sub{ font-size:9.5px; color: var(--muted); line-height:1.3; }

  .hero-card{
    background: linear-gradient(155deg, #17352A 0%, #131A17 65%);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .hero-label{
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 700; margin-bottom: 6px;
  }
  .hero-number{ font-size: 32px; font-weight: 800; margin-bottom: 12px; }
  .ring-row{ display:flex; align-items:center; gap: 12px; }
  .ring{ position:relative; width:44px; height:44px; flex-shrink:0; }
  .ring svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .ring-track{ fill:none; stroke: rgba(255,255,255,0.08); stroke-width:6; }
  .ring-fill{ fill:none; stroke: var(--green); stroke-width:6; stroke-linecap:round; transition: stroke-dasharray .4s ease; }
  .ring-text{ font-size: 11.5px; color: var(--muted); line-height:1.4; }
  .ring-text b{ color: var(--ink); }

  .cta{
    display:flex; justify-content: space-between; align-items:center;
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 13px 15px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
    cursor:pointer;
  }
  .cta .go{ color: var(--green); font-size: 15px; }
  .cta:active{ background: var(--card); }

  .mini-note{ font-size: 11.5px; color: var(--muted); text-align:center; margin: 10px 0 6px; }

  .section-label{
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); font-weight: 700; margin: 16px 0 8px;
  }

  .card-row{
    display:flex; justify-content: space-between; align-items:center;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 13px 15px;
    font-size: 13px;
    margin-bottom: 8px;
    cursor:pointer;
  }
  .card-row:active{ background: var(--card-2); }
  .card-row.dashed{ border-style: dashed; opacity: 0.8; }
  .card-row .name{ font-weight:700; }
  .card-row .meta{ color: var(--muted); font-size: 11px; margin-top: 2px; }
  .card-row .val{ font-weight:700; font-size: 13px; white-space:nowrap; }
  .card-row .val.muted{ color: var(--muted); font-weight:600; font-size:11.5px; }

  .badge-pago{
    font-size: 10px; font-weight:700; color: var(--green);
    border: 1px solid var(--green-deep); background: rgba(62,207,142,0.1);
    border-radius: 100px; padding: 3px 9px;
  }
  .badge-pend{
    font-size: 10px; font-weight:700; color: var(--muted);
    border: 1px solid var(--card-border); border-radius: 100px; padding: 3px 9px;
  }
  .badge-atrasado{
    font-size: 10px; font-weight:700; color: var(--danger);
    border: 1px solid var(--danger); background: rgba(192,82,74,0.1);
    border-radius: 100px; padding: 3px 9px;
  }
  .card-row.atrasado{ border-color: rgba(192,82,74,0.4); }

  .btn-add{
    border: 1.5px dashed var(--card-border);
    border-radius: 14px;
    text-align:center;
    padding: 13px;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 4px;
    cursor:pointer;
  }
  .btn-add:active{ background: var(--card); }

  .edit-icon{
    font-size: 12px; color: var(--muted); margin-left: 8px; cursor:pointer;
  }

  .empty-state{
    text-align:center; padding: 40px 10px; color: var(--muted); font-size: 13px; line-height:1.6;
  }

  .navbar{
    display:flex; border-top: 1px solid var(--card-border);
    background: #0A0D0B;
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    font-size: 10px; color: var(--muted); font-weight:600; padding: 10px 0;
    cursor:pointer;
  }
  .navitem svg{ width:20px; height:20px; }
  .nav-icon-wrap{ width:36px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:10px; }
  .navitem.active{ color: var(--green); }
  .navitem.active .nav-icon-wrap{ background: rgba(62,207,142,0.14); }
  .navitem.disabled{ opacity: 0.35; cursor: default; }
  .navdot{ width:5px; height:5px; border-radius:50%; background: currentColor; }

  /* Modal */
  #modal-overlay{
    position:absolute; inset:0; background: rgba(0,0,0,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 20;
  }
  .modal-sheet{
    width:100%; background: var(--card); border-top: 1px solid var(--card-border);
    border-radius: 22px 22px 0 0; padding: 20px 20px 24px;
    max-height: 80%; overflow-y:auto;
  }
  .modal-title{ font-size:15px; font-weight:800; margin-bottom:14px; }
  .field-label{ font-size:11px; color: var(--muted); font-weight:700; margin: 12px 0 6px; text-transform:uppercase; letter-spacing:0.04em; }
  .field-input, select.field-input{
    width:100%; background: var(--bg); border:1px solid var(--card-border);
    color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 13px;
    outline:none;
  }
  .field-input:focus{ border-color: var(--green); }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .toggle-row .lbl{ font-size:13px; font-weight:600; }
  .switch{ width:38px; height:22px; border-radius:100px; background: var(--track); position:relative; cursor:pointer; flex-shrink:0; }
  .switch.on{ background: var(--green-deep); }
  .switch .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background: var(--muted); transition: all .2s; }
  .switch.on .knob{ left:18px; background: var(--green); }

  .modal-btns{ display:flex; gap:10px; margin-top: 20px; }
  .btn{
    flex:1; text-align:center; padding: 12px; border-radius: 12px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-cancel{ background: transparent; border: 1px solid var(--card-border); color: var(--muted); }
  .btn-confirm{ background: var(--green); border:1px solid var(--green); color: #06140E; }
  .btn-confirm:active, .btn-cancel:active{ opacity:0.8; }

  .quitada-banner{
    background: rgba(62,207,142,0.1); border: 1px solid var(--green-deep);
    border-radius: 14px; padding: 14px; margin: 14px 0; text-align:center;
  }
  .quitada-banner .title{ font-weight:800; font-size:13.5px; color: var(--green); margin-bottom:8px; }
  .btn-danger{
    border: 1px solid var(--danger); color: var(--danger); border-radius: 10px;
    padding: 9px 14px; font-size:12px; font-weight:700; display:inline-block; cursor:pointer;
  }
  .saque-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:9px 0; border-bottom:1px solid var(--card-border); }
  .saque-row:last-child{ border-bottom:none; }

  /* Tela de login */
  #login-screen{
    position:absolute; inset:0; background: var(--bg); z-index: 60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px; text-align:center;
  }
  #login-screen .login-logo{ width:44px; height:92px; margin-bottom:18px; }
  #login-screen h1{ font-size:22px; margin:0 0 6px; }
  #login-screen h1 .c{ color:var(--green); }
  #login-screen p{ font-size:13px; color:var(--muted); margin:0 0 32px; max-width:260px; line-height:1.5; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1F1F1F; font-weight:700; font-size:14px;
    border-radius:12px; padding:13px 20px; cursor:pointer; border:none;
  }
  .google-btn svg{ width:18px; height:18px; }
  .google-btn:active{ opacity:0.85; }
  #login-error{ color:var(--danger); font-size:12px; margin-top:16px; max-width:260px; }
  #splash{
    position:absolute; inset:0; background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index: 50; transition: opacity .5s ease;
  }
  #splash.splash-hide{ opacity:0; pointer-events:none; }
  .morph-svg{ width: 320px; height: 134px; overflow: visible; display:block; }
  .morph-piece{
    transform-box: fill-box; transform-origin: 50% 50%;
    animation-duration: 1.4s; animation-delay: 1.9s;
    animation-timing-function: cubic-bezier(.5,0,.2,1);
    animation-fill-mode: both;
  }
  .mp1{ animation-name: f_stem; } .mp2{ animation-name: f_top; } .mp3{ animation-name: f_mid; }
  .mp4{ animation-name: i_bar; } .mp5{ animation-name: n_left; } .mp6{ animation-name: n_right; }
  .mp8{ animation-name: c_top; } .mp9{ animation-name: c_left; } .mp10{ animation-name: c_bottom; }
  @keyframes f_stem{ 0%{ x:8px; y:23px; width:13px; height:54px; rx:2px; fill:var(--ink); } 100%{ x:38px; y:52px; width:26px; height:24px; rx:6px; fill:var(--green); } }
  @keyframes f_top{ 0%{ x:8px; y:23px; width:38px; height:13px; rx:2px; fill:var(--ink); } 100%{ x:41px; y:34px; width:20px; height:14px; rx:5px; fill:var(--green); fill-opacity:0.65; } }
  @keyframes f_mid{ 0%{ x:8px; y:45px; width:28px; height:12px; rx:2px; fill:var(--ink); } 100%{ x:45.8px; y:20.8px; width:6.4px; height:6.4px; rx:3.2px; fill:var(--green); fill-opacity:0.5; } }
  @keyframes i_bar{ 0%{ x:54px; y:23px; width:13px; height:54px; rx:2px; fill:var(--ink); } 100%{ x:38px; y:52px; width:26px; height:24px; rx:6px; fill:var(--green); } }
  @keyframes n_left{ 0%{ x:75px; y:23px; width:13px; height:54px; rx:0px; fill:var(--ink); } 100%{ x:41px; y:34px; width:20px; height:14px; rx:5px; fill:var(--green); fill-opacity:0.65; } }
  @keyframes n_right{ 0%{ x:100px; y:23px; width:13px; height:54px; rx:0px; fill:var(--ink); } 100%{ x:57.7px; y:16.7px; width:4.6px; height:4.6px; rx:2.3px; fill:var(--green); fill-opacity:0.38; } }
  @keyframes c_top{ 0%{ x:121px; y:23px; width:38px; height:13px; rx:2px; fill:var(--green); } 100%{ x:38px; y:52px; width:26px; height:24px; rx:6px; fill:var(--green); } }
  @keyframes c_left{ 0%{ x:121px; y:23px; width:13px; height:54px; rx:2px; fill:var(--green); } 100%{ x:41px; y:34px; width:20px; height:14px; rx:5px; fill:var(--green); fill-opacity:0.65; } }
  @keyframes c_bottom{ 0%{ x:121px; y:64px; width:38px; height:13px; rx:2px; fill:var(--green); } 100%{ x:64.7px; y:26.7px; width:2.6px; height:2.6px; rx:1.3px; fill:var(--green); fill-opacity:0.18; } }
</style>
</head>
<body>

<div id="shell">
  <div id="login-screen" style="display:none;">
    <svg class="login-logo" viewBox="34 6 38 74">
      <rect x="38" y="52" width="26" height="24" rx="6" fill="var(--green)"/>
      <rect x="41" y="34" width="20" height="14" rx="5" fill="var(--green)" opacity="0.65"/>
      <circle cx="49" cy="24" r="3.2" fill="var(--green)" opacity="0.5"/>
      <circle cx="60" cy="19" r="2.3" fill="var(--green)" opacity="0.38"/>
      <circle cx="54" cy="12" r="1.7" fill="var(--green)" opacity="0.26"/>
      <circle cx="66" cy="28" r="1.3" fill="var(--green)" opacity="0.18"/>
    </svg>
    <h1>FIN<span class="c">C</span></h1>
    <p>Controle sem complexidade. Entre com sua conta Google pra acessar seus dados em qualquer aparelho.</p>
    <button class="google-btn" onclick="signIn()">

function makeParcelas(labels, valor){

function buildSeedData(){
  const hoje = new Date();

  function gerarParcelasComData(qtd, valor, vencimentoDia, mesesAFrente=0){
    const arr = [];
    for(let i=0;i<qtd;i++){
      const alvo = hoje.getMonth() + mesesAFrente + i;
      const y = hoje.getFullYear() + Math.floor(alvo/12);
      const m = ((alvo%12)+12)%12;
      const day = Math.min(vencimentoDia, daysInMonth(y,m));
      arr.push({
        id: uid(), label: MESES_ABR[m]+'/'+String(y).slice(2), valor,
        pago:false, dataVenc: `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
      });
    }
    return arr;
  }

  const diaVencProximo = hoje.getDate() + 4 > 28 ? (hoje.getDate()+4-28) : hoje.getDate()+4;
  const financiamentoParcelas = gerarParcelasComData(6, 385.00, diaVencProximo, 0);

  const cartaoParcelas = gerarParcelasComData(10, 179.10, 5, -2);
  cartaoParcelas.forEach((p,i)=>{ if(i<7) p.pago = true; });

  const quitadaParcelas = makeParcelas(Array.from({length:10}, (_,i)=>'Parcela '+(i+1)), 539.00);
  quitadaParcelas.forEach(p=>{ p.pago = true; });

  return [{
    id: uid(),
    nome: 'Banco Exemplo',
    dividas: [
      {
        id: uid(), nome: 'Financiamento', tipo: 'financiamento', tipoLabel: 'Financiamento', temVencimento: true, vencimentoDia: diaVencProximo,
        parcelas: financiamentoParcelas, saques: []
      },

        id: uid(), nome: 'Cartão', tipo: 'cartao', tipoLabel: 'Cartão', temVencimento: true, vencimentoDia: 5,

      },
      {
        id: uid(), nome: 'Empréstimo quitado', tipo: 'emprestimo', tipoLabel: 'Empréstimo', temVencimento: false, vencimentoDia: null,
        parcelas: quitadaParcelas, saques: []
      }
    ]
  }];
}

function dividaSaldo(divida){
  return divida.parcelas.filter(p=>!p.pago).reduce((s,p)=>s+p.valor,0);
}
function credorSaldo(credor){
  return credor.dividas.reduce((s,d)=>s+dividaSaldo(d),0);
}
function totalSaldo(){
  return state.credores.reduce((s,c)=>s+credorSaldo(c),0);
}
function overallProgress(){
  let totalVal=0, paidVal=0;
  state.credores.forEach(c=>c.dividas.forEach(d=>{
    d.parcelas.forEach(p=>{ totalVal+=p.valor; if(p.pago) paidVal+=p.valor; });
  }));
  if(totalVal===0) return 0;
  return Math.round((paidVal/totalVal)*100);
}

const DIAS_SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

function nextDueInfo(){
  let candidates = [];
  state.credores.forEach(c=>c.dividas.forEach(d=>{
    if(!d.temVencimento) return;
    const pendente = d.parcelas.find(p=>!p.pago && p.dataVenc);
    if(pendente){
      candidates.push({
        credorId: c.id, dividaId: d.id, dividaNome: d.nome,
        valor: pendente.valor, dataVenc: pendente.dataVenc,
        pendentesCount: d.parcelas.filter(p=>!p.pago).length
      });
    }
  }));
  if(!candidates.length) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  candidates.forEach(c=>{
    const [y,m,dday] = c.dataVenc.split('-').map(Number);
    c.due = new Date(y, m-1, dday);
    c.diffDays = Math.ceil((c.due - today) / (1000*60*60*24));
  });
  candidates.sort((a,b)=>a.due-b.due);
  return candidates[0];
}

function motivationalMessage(pendingCount, progress){
  const day = new Date().getDate();
  const templates = [
    `Faltam apenas ${pendingCount} parcela${pendingCount===1?'':'s'} para concluir seus compromissos.`,
    `Você está mais perto da sua organização financeira.`,
    `Continue assim. Você já concluiu ${progress}% deste mês.`,
    `Mais um pagamento e você estará ainda mais próximo do fim.`
  ];
  return templates[day % templates.length];
}

function addDivida(credorId, opts){
  const c = state.credores.find(c=>c.id===credorId);
  if(!c) return;
  const parcelas = [];
  let baseYear, baseMonth;
  if(opts.temVencimento && opts.mesInicio){
    const [y,m] = opts.mesInicio.split('-').map(Number);
    baseYear = y; baseMonth = m-1;
  }
  for(let i=0;i<opts.qtdParcelas;i++){
    const parcela = { id: uid(), label: 'Parcela ' + (i+1), valor: opts.valorParcela, pago: false };
    if(opts.temVencimento && baseYear!==undefined){
      const targetMonth = baseMonth + i;
      const y = baseYear + Math.floor(targetMonth/12);
      const m = ((targetMonth%12)+12)%12;
      const day = Math.min(opts.vencimentoDia, daysInMonth(y,m));
      parcela.dataVenc = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      parcela.label = MESES_ABR[m] + '/' + String(y).slice(2);
    }
    parcelas.push(parcela);
  }
  c.dividas.push({
    id: uid(), nome: opts.nome, tipo: opts.tipo, tipoLabel: opts.tipoLabel, temVencimento: opts.temVencimento,
    vencimentoDia: opts.temVencimento ? opts.vencimentoDia : null,

}

function submitAddSaque(credorId, dividaId){

function viewCalendario(){
  let itens = [];
  state.credores.forEach(c=>c.dividas.forEach(d=>{

      itens.push({ credorNome:c.nome, dividaNome:d.nome, data:p.dataVenc, valor:p.valor,
        credorId:c.id, dividaId:d.id });
    });
  }));
  itens.sort((a,b)=>a.data.localeCompare(b.data));

  const hojeStr = new Date().toISOString().slice(0,10);
  const rows = itens.map(it=>{
    const [y,m,dday] = it.data.split('-').map(Number);

function exportBackup(){
  const payload = JSON.stringify({ credores: state.credores, exportadoEm: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'finc-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const credores = Array.isArray(parsed) ? parsed : parsed.credores;
      if(!Array.isArray(credores)) throw new Error('formato inválido');
      state.credores = credores;
      await saveData();
      goTo('home');
    }catch(err){
      alert('Não foi possível ler esse arquivo de backup.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

    </div>`;

  return `
    <div class="backbar" onclick="goTo('credores')"><span class="arrow">←</span>${c.nome}<span class="edit-icon" onclick="event.stopPropagation(); openModal('renameCredor', {id:'${c.id}', nomeAtual:'${c.nome}'})">✎</span></div>
    <div class="hero-card">
      <div class="hero-label">Compromissos com ${c.nome}</div>
      <div class="hero-number">${fmtMoney(credorSaldo(c))}</div>
    </div>

    ${ comVenc.length ? `<div class="section-label">Contas — com vencimento</div>${comVenc.map(d=>rowFor(d,false)).join('')}` : ''}
    ${ semVenc.length ? `<div class="section-label">Sem vencimento definido</div>${semVenc.map(d=>rowFor(d,true)).join('')}` : ''}
    ${ !c.dividas.length ? `<div class="empty-state">Nenhuma conta cadastrada ainda.</div>` : ''}

    <div class="btn-add" onclick="openModal('addDivida', {credorId:'${c.id}'})">+ Nova conta</div>
  `;
}

function viewDividaDetail(){
  const c = state.credores.find(c=>c.id===state.selectedCredorId);
  const d = c && c.dividas.find(d=>d.id===state.selectedDividaId);
  if(!d) return `<div class="empty-state">Dívida não encontrada.</div>`;

  const hojeStr = new Date().toISOString().slice(0,10);
  const parcelasHtml = d.parcelas.map(p => {
    const atrasada = !p.pago && p.dataVenc && p.dataVenc < hojeStr;
    return `
    <div class="card-row ${atrasada?'atrasado':''}">
      <span class="name" onclick="togglePago('${c.id}','${d.id}','${p.id}')" style="flex:1;">${p.label} — ${fmtMoney(p.valor)}</span>
      <span class="edit-icon" onclick="openModal('editParcela', {credorId:'${c.id}', dividaId:'${d.id}', parcelaId:'${p.id}', valorAtual:${p.valor}})">✎</span>
      <span class="${p.pago?'badge-pago':(atrasada?'badge-atrasado':'badge-pend')}" onclick="togglePago('${c.id}','${d.id}','${p.id}')" style="margin-left:8px;">${p.pago?'Pago':(atrasada?'Atrasado':'Pendente')}</span>
    </div>
  `;
  }).join('');

  const saquesHtml = d.tipo==='emprestimo' ? `
    <div class="section-label">Histórico de saques</div>
    ${ d.saques.length ? d.saques.map(s=>`<div class="saque-row"><span>${s.data}</span><span>${fmtMoney(s.valor)}</span></div>`).join('') : `<div class="mini-note" style="margin:6px 0;">Nenhum saque registrado.</div>` }
    <div class="btn-add" onclick="openModal('addSaque', {credorId:'${c.id}', dividaId:'${d.id}'})">+ Adicionar saque</div>
  ` : '';

  const quitada = dividaSaldo(d)===0 && d.parcelas.length>0;

  return `
    <div class="backbar" onclick="goTo('credorDetail')"><span class="arrow">←</span>${d.nome}<span class="edit-icon" onclick="event.stopPropagation(); openModal('renameDivida', {credorId:'${c.id}', dividaId:'${d.id}', nomeAtual:'${d.nome}'})">✎</span></div>
    <div class="hero-card">
      <div class="hero-label">Restante</div>
      <div class="hero-number">${fmtMoney(dividaSaldo(d))}</div>
      <div class="mini-note" style="margin:0; text-align:left;">${d.tipoLabel || ''} ${ d.temVencimento ? '· Vencimento: dia '+d.vencimentoDia : '· Sem vencimento fixo' }</div>
    </div>
    ${ quitada ? `
    <div class="quitada-banner">
      <div class="title">🎉 Conta quitada!</div>
      <div class="mini-note" style="margin:0 0 12px;">Você pode manter no histórico ou excluir esta conta.</div>
      <div class="btn-danger" onclick="openModal('confirmDelete', {credorId:'${c.id}', dividaId:'${d.id}', nome:'${d.nome}'})">Excluir conta</div>
    </div>
    ` : '' }
    <div class="section-label">Parcelas</div>
    ${parcelasHtml}
    ${saquesHtml}
  `;
}

function render(){
  const content = document.getElementById('content');
  if(!state.loaded){
    content.innerHTML = `<div class="empty-state">Carregando...</div>`;
    return;
  }
  let html = '';
  if(state.view==='home') html = viewHome();
  else if(state.view==='credores') html = viewCredores();
  else if(state.view==='credorDetail') html = viewCredorDetail();
  else if(state.view==='dividaDetail') html = viewDividaDetail();
  else if(state.view==='calendario') html = viewCalendario();
  else if(state.view==='resumo') html = viewResumo();
  else if(state.view==='perfil') html = viewPerfil();
  else if(state.view==='configuracoes') html = viewConfiguracoes();
  content.innerHTML = html;

  document.querySelectorAll('.navitem[data-nav]').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav===state.view || (el.dataset.nav==='credores' && ['credorDetail','dividaDetail'].includes(state.view)));
  });

  const shell = document.getElementById('shell');
  const existingModal = document.getElementById('modal-overlay');
  if(existingModal) existingModal.remove();
  if(state.modal){
    shell.insertAdjacentHTML('beforeend', renderModal());
    setTimeout(()=>{
      const inp = document.getElementById('m-nome');
      if(inp) inp.focus();
    },50);
  }
}

// ---------- Menu lateral ----------
function openMenu(){
  const shell = document.getElementById('shell');
  const existing = document.getElementById('menu-overlay');
  if(existing) existing.remove();
  shell.insertAdjacentHTML('beforeend', `
    <div id="menu-overlay" onclick="if(event.target.id==='menu-overlay') closeMenu()">
      <div class="side-menu">
        <div class="menu-brand">
          <svg viewBox="34 6 38 74">
            <rect x="38" y="52" width="26" height="24" rx="6" fill="var(--green)"/>
            <rect x="41" y="34" width="20" height="14" rx="5" fill="var(--green)" opacity="0.65"/>
            <circle cx="49" cy="24" r="3.2" fill="var(--green)" opacity="0.5"/>
            <circle cx="60" cy="19" r="2.3" fill="var(--green)" opacity="0.38"/>
            <circle cx="54" cy="12" r="1.7" fill="var(--green)" opacity="0.26"/>
            <circle cx="66" cy="28" r="1.3" fill="var(--green)" opacity="0.18"/>
          </svg>
          <span class="topbar-word" style="font-size:17px;">FIN<span class="c">C</span></span>
        </div>
        <div class="menu-item ${state.view==='home'?'active':''}" onclick="closeMenu(); goTo('home', {selectedCredorId:null, selectedDividaId:null});">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Início
        </div>
        <div class="menu-item ${['credores','credorDetail','dividaDetail'].includes(state.view)?'active':''}" onclick="closeMenu(); goTo('credores', {selectedCredorId:null, selectedDividaId:null});">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Contas
        </div>
        <div class="menu-item ${state.view==='perfil'?'active':''}" onclick="closeMenu(); goTo('perfil', {selectedCredorId:null, selectedDividaId:null});">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Perfil
        </div>
        <div class="menu-item ${state.view==='configuracoes'?'active':''}" onclick="closeMenu(); goTo('configuracoes');">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>Configurações
        </div>
      </div>
    </div>
  `);
}
function closeMenu(){
  const el = document.getElementById('menu-overlay');
  if(el) el.remove();
}

document.getElementById('navbar').addEventListener('click', (e)=>{
  const item = e.target.closest('.navitem[data-nav]');
  if(item) goTo(item.dataset.nav, {selectedCredorId:null, selectedDividaId:null});
});

// loadData() é chamado automaticamente pelo listener de login (auth.onAuthStateChanged) mais acima.

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(console.error);
  });
}

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash) splash.classList.add('splash-hide');
}, 3600);
</script>
</body>
